# Daily refresh: Yahoo -> BSM -> Google Sheet "BSM Data" (Tableau Public syncs the sheet once a day).
#
# Schedule: 21:30 UTC Mon-Fri = 5:30pm ET in summer / 4:30pm ET in winter, i.e. always after the
# 4pm ET close whatever the DST offset. Market holidays run harmlessly (Yahoo serves the last close
# and iv_history de-duplicates on date/ticker/expiry).
#
# Secret required (repo Settings -> Secrets and variables -> Actions):
#   GOOGLE_SERVICE_ACCOUNT_JSON  = full contents of the service-account key file
#
# If Yahoo starts rate-limiting GitHub's runner IPs (429s in the log), switch to the local launchd
# fallback in scripts/ and disable this workflow.
name: daily-refresh

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated ticker override (blank = config.yaml)"
        required: false
        default: ""
      no_export:
        description: "Dry run: fetch + price only, skip Google Sheets"
        type: boolean
        default: false

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Unit tests (model only, no network)
        run: pytest -q

      - name: Write service-account key
        if: ${{ !inputs.no_export }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON secret is not set"; exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service_account.json"
          echo "GOOGLE_SERVICE_ACCOUNT_FILE=$RUNNER_TEMP/service_account.json" >> "$GITHUB_ENV"

      - name: Run pipeline
        env:
          PYTHONUNBUFFERED: "1"
          # Passed via env (not inlined into the script) so dispatch inputs can't inject shell.
          TICKERS: ${{ inputs.tickers }}
          NO_EXPORT: ${{ inputs.no_export }}
        run: |
          ARGS=()
          if [ -n "$TICKERS" ]; then ARGS+=(--tickers "$TICKERS"); fi
          if [ "$NO_EXPORT" = "true" ]; then ARGS+=(--no-export); fi
          python -m bsm.pipeline "${ARGS[@]}"

      - name: Upload CSV mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: options_latest-${{ github.run_id }}
          path: |
            data/processed/options_latest.csv
            data/processed/iv_history_latest.csv
          retention-days: 7
          if-no-files-found: ignore
